worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  # Only tunnel pods may reach this server (enforced by the portfolio NetworkPolicy).
  # The real-IP header is trusted only on the observed k3s pod network.
  set_real_ip_from 10.42.0.0/24;
  real_ip_header CF-Connecting-IP;

  map $uri $client_limit_key {
    /healthz "";
    default $binary_remote_addr;
  }
  map $uri $site_limit_key {
    /healthz "";
    default portfolio;
  }
  limit_req_zone $client_limit_key zone=per_client:10m rate=10r/s;
  limit_req_zone $site_limit_key zone=whole_site:1m rate=200r/s;
  limit_req_status 429;
  limit_req_log_level notice;
  client_max_body_size 1k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 10s;
  keepalive_timeout 15s;
  keepalive_requests 100;
  max_ranges 1;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
    limit_req zone=per_client burst=60 nodelay;
    limit_req zone=whole_site burst=400 nodelay;

    # Cloudflare supplies the original scheme even though the tunnel uses HTTP.
    if ($http_x_forwarded_proto = http) {
      return 308 https://gsaab.dev$request_uri;
    }

    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    location ~ (^|/)\. {
      return 404;
    }

    location / {
      try_files $uri $uri/ =404;
    }

    location = /404.html {
      internal;
    }

    # Private, unlisted pages: never indexed, cached or archived.
    # add_header in a location replaces the server ones, so repeat them here.
    location ^~ /p/ {
      try_files $uri $uri/ =404;
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
      include /etc/nginx/security-headers.conf;
    }

    location /_astro/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
      include /etc/nginx/security-headers.conf;
    }
  }
}
