name: Verify website

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: housy:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the production container
        run: |
          docker run --detach --name housy-test --read-only \
            --tmpfs /tmp:rw,nosuid,noexec,size=32m --cap-drop ALL \
            --security-opt no-new-privileges -p 127.0.0.1:8080:8080 housy:verify
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/healthz
          npm run test:server
      - name: Stop test container
        if: always()
        run: docker rm --force housy-test || true
