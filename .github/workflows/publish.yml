name: Publish and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: housy:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify production server
        run: |
          docker run --detach --name housy-test --read-only \
            --tmpfs /tmp:rw,nosuid,noexec,size=32m --cap-drop ALL \
            --security-opt no-new-privileges -p 127.0.0.1:8080:8080 housy:verify
          if ! curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 1 --retry-max-time 20 --max-time 2 http://127.0.0.1:8080/healthz; then
            docker logs housy-test
            exit 1
          fi
          npm run test:server
      - name: Stop test container
        if: always()
        run: docker rm --force housy-test || true

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Private take-home: pulled from a private repo with a read-only deploy key,
      # then synced into the (gitignored) build inputs the Docker build copies.
      - name: Check out private take-home
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GhadiSaab/revolut-takehome
          ref: main
          path: .takehome
          persist-credentials: false
          ssh-key: ${{ secrets.TAKEHOME_DEPLOY_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Sync private take-home
        run: node scripts/takehome-sync.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: printf 'name=ghcr.io/%s\n' "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Deploy image: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: website
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check out production GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GhadiSaab/flux-homelab
          ref: main
          path: gitops
          fetch-depth: 0
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
      - name: Update production image
        env:
          GITOPS_DIR: ${{ github.workspace }}/gitops
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: https://github.com/GhadiSaab/Housy.git
        run: |
          git -C "$GITOPS_DIR" config user.name 'housy-deploy[bot]'
          git -C "$GITOPS_DIR" config user.email 'housy-deploy@users.noreply.github.com'
          node website/scripts/deploy.mjs | tee -a "$GITHUB_STEP_SUMMARY"
